<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#050505">

  <title>Time Coach - SV Group</title>

 <link rel="stylesheet" href="style.css?v=3"> 
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header>

      <div class="logo">
        <img
          src="file_000000006cc482089143d3ee4739189d.png"
          alt="SV Group Logo"
          style="width:70px;height:70px;object-fit:contain;margin-bottom:8px;"
        >
      </div>

      <h1>⏱️ Time Coach</h1>

      <p>SV Group • Daily Routine</p>

    </header>


    <!-- PERSON -->
    <section class="card">

      <h2>👤 Person</h2>

      <label for="personName">
        Person Name
      </label>

      <input
        id="personName"
        type="text"
        placeholder="नाम लिखें"
      >

      <button id="savePersonBtn">
        💾 Save Person
      </button>

      <p id="personMessage"></p>

      <p id="savedPerson"></p>

    </section>


    <!-- DAILY ROUTINE -->
    <section class="card">

      <h2>➕ Daily Routine</h2>

      <label for="taskName">
        Task / काम
      </label>

      <input
        id="taskName"
        type="text"
        placeholder="जैसे Coaching"
      >

      <label for="taskTime">
        Time / समय
      </label>

      <input
        id="taskTime"
        type="time"
      >

      <button id="addRoutineBtn">
        ➕ Add Routine
      </button>

    </section>


    <!-- NEXT TASK -->
    <section class="card">

      <h2>🔔 Next Task</h2>

      <div id="nextTask">
        अभी कोई routine नहीं है
      </div>

    </section>


    <!-- TODAY'S ROUTINE -->
    <section class="card">

      <h2>📅 Today's Routine</h2>

      <div id="routineList">

        <div class="empty">
          अभी कोई routine नहीं है
        </div>

      </div>

    </section>


    <!-- VOICE -->
    <section class="card">

      <h2>🔊 Voice</h2>

      <div class="voice-setting">

        <button
          id="testVoiceBtn"
          class="secondary-btn"
        >
          ▶️ Voice Test
        </button>

        <p style="color:#999;text-align:center;margin-top:10px;font-size:13px;">
          Phone की आवाज़ ON रखें।
        </p>

      </div>

    </section>


    <!-- STATUS -->
    <section class="card">

      <h2>📡 Status</h2>

      <div style="display:flex;justify-content:space-between;align-items:center;">

        <span>
          <span
            class="green-dot"
            style="
              display:inline-block;
              width:9px;
              height:9px;
              background:#39d353;
              border-radius:50%;
              margin-right:6px;
            "
          ></span>

          Time Coach चालू है
        </span>

        <strong
          id="currentTime"
          style="color:#d4af37;"
        >
          --:--:--
        </strong>

      </div>

    </section>


    <!-- FOOTER -->
    <footer>
      © 2026 <strong>SV Group</strong> • Time Coach
    </footer>

  </div>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
