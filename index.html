<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Coach - SV Group</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="logo">SV</div>

    <div>
      <h1>⏱️ Time Coach</h1>
      <p>SV Group • Daily Routine</p>
    </div>
  </header>


  <main class="container">

    <!-- PERSON -->
    <section class="card">
      <h2>👤 Person</h2>

      <input
        id="personName"
        type="text"
        placeholder="नाम लिखें"
      >

      <button id="savePersonBtn" class="gold-btn">
        💾 Save Person
      </button>

      <p id="personMessage" class="message"></p>
    </section>


    <!-- ADD ROUTINE -->
    <section class="card">

      <h2>➕ Daily Routine</h2>

      <label>Task / काम</label>

      <input
        id="taskName"
        type="text"
        placeholder="जैसे Coaching"
      >

      <label>Time / समय</label>

      <input
        id="taskTime"
        type="time"
      >

      <button id="addRoutineBtn" class="gold-btn">
        ➕ Add Routine
      </button>

    </section>


    <!-- NEXT TASK -->
    <section class="next-card">

      <div class="next-label">
        🔔 Next Task
      </div>

      <div id="nextTask">
        अभी कोई routine नहीं है
      </div>

    </section>


    <!-- ROUTINES -->
    <section class="card">

      <h2>📅 Today's Routine</h2>

      <div id="routineList">
        <div class="empty">
          अभी कोई routine नहीं है
        </div>
      </div>

    </section>


    <!-- VOICE -->
    <section class="card">

      <h2>🔊 Voice</h2>

      <button id="testVoiceBtn" class="dark-btn">
        ▶️ Voice Test
      </button>

      <p class="hint">
        Phone की आवाज़ ON रखें।
      </p>

    </section>


    <!-- CLOCK -->
    <section class="status-card">

      <div>
        <span class="green-dot"></span>
        Time Coach चालू है
      </div>

      <strong id="currentTime">
        --:--
      </strong>

    </section>

  </main>


  <footer>
    © 2026 SV Group
  </footer>


  <script src="script.js"></script>

</body>
</html>
