<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#000000">

  <meta name="description"
        content="Time Coach - Daily Routine Reminder by SV Group">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">

  <link rel="stylesheet" href="style.css">

  <title>Time Coach - SV Group</title>
</head>

<body>

  <header class="topbar">
    <div class="logo">SV</div>

    <div>
      <h1>⏱️ Time Coach</h1>
      <p>SV Group • Daily Routine</p>
    </div>
  </header>


  <main class="container">

    <!-- PERSON -->
    <section class="card">
      <h2>👤 Person</h2>

      <input
        type="text"
        id="personName"
        placeholder="नाम लिखें"
        autocomplete="off"
      >

      <button id="savePersonBtn" class="primary">
        💾 Save Person
      </button>

      <div id="personMessage" class="message"></div>
    </section>


    <!-- ADD ROUTINE -->
    <section class="card">

      <h2>➕ Daily Routine</h2>

      <label>काम / Task</label>

      <input
        type="text"
        id="taskName"
        placeholder="जैसे Coaching"
        autocomplete="off"
      >


      <label>समय</label>

      <input
        type="time"
        id="taskTime"
      >


      <button id="addRoutineBtn" class="primary">
        ➕ Add Routine
      </button>

    </section>


    <!-- NEXT TASK -->
    <section class="next-card">

      <div class="next-title">
        🔔 Next Task
      </div>

      <div id="nextTask">
        अभी कोई routine नहीं है
      </div>

    </section>


    <!-- TODAY ROUTINE -->
    <section class="card">

      <div class="section-heading">
        <h2>📅 Today's Routine</h2>

        <button id="notificationBtn" class="small-btn">
          🔔 Notification
        </button>
      </div>

      <div id="routineList">
        <div class="empty">
          अभी कोई routine नहीं है
        </div>
      </div>

    </section>


    <!-- TEST VOICE -->
    <section class="card">

      <h2>🔊 Voice Test</h2>

      <button id="testVoiceBtn" class="secondary">
        ▶️ Voice Test
      </button>

      <p class="hint">
        Voice reminder के लिए phone की आवाज़ ON रखें।
      </p>

    </section>


    <!-- STATUS -->
    <section class="status-card">

      <div>
        <span class="status-dot"></span>
        <span id="statusText">Time Coach चालू है</span>
      </div>

      <div id="currentTime">
        --:--
      </div>

    </section>

  </main>


  <footer>
    <p>© 2026 SV Group</p>
  </footer>


  <script src="script.js"></script>

</body>
</html>
