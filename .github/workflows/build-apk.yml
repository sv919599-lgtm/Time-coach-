name: Build Time Coach APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create web folder
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp script.js www/
          cp icon.png www/ || true

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "time-coach",
            "version": "1.0.0",
            "private": true,
            "scripts": {},
            "dependencies": {
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

      - name: Install Capacitor
        run: npm install

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.svgroup.timecoach",
            "appName": "Time Coach",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Copy web files
        run: npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Time-Coach-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
